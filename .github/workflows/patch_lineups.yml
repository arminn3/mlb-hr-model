name: Patch Posted Lineups

# Runs every 15 min during the pre-game window. Calls patch_lineups.py which
# reads each team's posted lineup from MLB Stats API and patches
# team_pitch_mix.{side}.lineup_status / batters[].order in the slate JSON.
# This is what makes the rankings auto-filter to the 9 confirmed starters
# without the user needing to click "Refresh Lineups" — the slate itself
# carries the posted-lineup state, and the frontend reads it.

on:
  schedule:
    - cron: '*/15 12-20 * * *'   # 8:00 AM - 4:45 PM ET, every 15 min
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Default: today.'
        required: false
        default: ''

concurrency:
  # Shared with refresh_pitchers + daily_model so the two `*/15` cron jobs
  # don't race on the same slate JSON. Both modifying frontend/public/data
  # concurrently caused `git pull --rebase` to hit conflicts in the Commit
  # step and exit 1, which is what fired the "All jobs have failed" emails.
  group: slate-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Patch + commit (with retry on push race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u +'%Y-%m-%d')"
          fi

          git fetch origin main

          # Retry loop survives push-races against daily_model.yml. patch_lineups.py
          # is idempotent — on rejection we reset to fresh origin/main and re-run the
          # patch so we keep whatever the racing workflow added (e.g. updated pitcher
          # profile, regenerated batter scores) while still applying our lineup patch.
          for attempt in 1 2 3 4 5; do
            git reset --hard origin/main
            python3 patch_lineups.py --date "$DATE"
            if git diff --quiet frontend/public/data; then
              echo "no lineup changes — done"
              exit 0
            fi
            git add frontend/public/data
            git commit -m "auto: patch posted lineups $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected — fetching fresh and re-running patch"
            git fetch origin main
            sleep $((attempt * 5))
          done

          echo "all 5 attempts failed — likely an auth issue, not a race"
          exit 1
