name: Refresh Probable Pitchers

# Lightweight metadata-only refresh — runs every 15 min between 8 AM and
# 4 PM ET so the slate always reflects MLB's latest probable starter even when
# rotations get juggled (rainouts, scratches, etc). Never touches scores.

on:
  schedule:
    - cron: '*/15 12-20 * * *'   # 8:00 AM - 4:45 PM ET, every 15 min
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Default: today.'
        required: false
        default: ''

concurrency:
  # Shared with patch_lineups so the two `*/15` cron jobs don't race on the
  # same slate JSON — concurrent writes to frontend/public/data caused
  # `git pull --rebase` conflicts in the Commit step.
  group: slate-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Refresh + commit (with retry on push race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          else
            DATE_ARG=""
          fi

          git fetch origin main

          # Retry loop survives push-races against daily_model.yml. refresh_pitchers.py
          # is idempotent — on rejection we reset to fresh origin/main and re-run the
          # refresher so we keep whatever the racing workflow added (e.g. lineup patch,
          # regenerated batter scores) while still applying our pitcher metadata update.
          for attempt in 1 2 3 4 5; do
            git reset --hard origin/main
            python3 refresh_pitchers.py $DATE_ARG
            if git diff --quiet frontend/public/data; then
              echo "no pitcher changes — done"
              exit 0
            fi
            git add frontend/public/data
            git commit -m "auto: refresh probable pitchers $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected — fetching fresh and re-running refresh"
            git fetch origin main
            sleep $((attempt * 5))
          done

          echo "all 5 attempts failed — likely an auth issue, not a race"
          exit 1
