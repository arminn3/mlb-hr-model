name: Refresh Probable Pitchers

# Lightweight metadata-only refresh — runs every 15 min between 8 AM and
# 4 PM ET so the slate always reflects MLB's latest probable starter even when
# rotations get juggled (rainouts, scratches, etc). Never touches scores.

on:
  schedule:
    - cron: '*/15 12-20 * * *'   # 8:00 AM - 4:45 PM ET, every 15 min
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Default: today.'
        required: false
        default: ''

concurrency:
  # Shared with patch_lineups so the two `*/15` cron jobs don't race on the
  # same slate JSON — concurrent writes to frontend/public/data caused
  # `git pull --rebase` conflicts in the Commit step.
  group: slate-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run refresher
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python3 refresh_pitchers.py --date ${{ github.event.inputs.date }}
          else
            python3 refresh_pitchers.py
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet frontend/public/data; then
            echo "no pitcher changes — skipping commit"
            exit 0
          fi
          git add frontend/public/data
          git commit -m "auto: refresh probable pitchers $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
